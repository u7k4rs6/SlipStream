name: sync

on:
  schedule:
    # 06:00 UTC daily (D6). Upstream commits hourly, but its content changes far
    # less often, and a daily diff matches the "what's new today" loop.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-run even if the upstream SHA is unchanged'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync upstream
        id: sync
        run: |
          python -m slipstream.sync --data site/data \
            ${{ inputs.force && '--force' || '' }} | tee sync.log
        env:
          PYTHONPATH: src

      # Upstream's links all sit behind a fastprep.io sign-in, so the site also
      # publishes a login-free route to the ~5% of questions that exist on
      # LeetCode. That map depends on a third party we do not control, so a bad
      # day at LeetCode must cost us the refresh and nothing else -- never the
      # sync, and never the existing origins.json, which stays valid until it is
      # deliberately replaced.
      - name: Refresh origin links
        id: origins
        continue-on-error: true
        run: python -m slipstream.origins --data site/data
        env:
          PYTHONPATH: src

      # `git diff` cannot answer this: meta.json carries a fresh synced_at every
      # run, so the tree always looks dirty. The sync reports what actually moved.
      # origins.json is exempt because it moves on LeetCode's schedule, not
      # upstream's -- a day where only it changed is a real change, not noise.
      - name: Discard a no-op run
        if: steps.sync.outputs.dataset_changed != 'true'
        run: |
          echo "upstream unchanged; discarding the refreshed timestamp"
          git checkout -- CHANGELOG.md 2>/dev/null || true
          git ls-files --modified site/data \
            | grep -v '^site/data/origins\.json$' \
            | xargs -r git checkout -- 2>/dev/null || true

      - name: Commit if anything moved
        if: steps.sync.outputs.dataset_changed == 'true' || steps.origins.outputs.origins_changed == 'true'
        run: |
          git config user.name  "slipstream-sync"
          git config user.email "actions@github.com"
          git add site/data CHANGELOG.md
          if [ "${{ steps.sync.outputs.dataset_changed }}" = "true" ]; then
            git commit -m "Sync upstream ${{ steps.sync.outputs.upstream_sha }}"
          else
            git commit -m "Refresh origin links (${{ steps.origins.outputs.origins_count }} direct)"
          fi
          git push

      # FR-7: a failed sync must be loud. A silently broken daily job is
      # indistinguishable from an upstream that stopped changing.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Sync failed on $(date -u +%Y-%m-%d)" \
            --label "sync-failure" \
            --body "The daily sync aborted. Output:

          \`\`\`
          $(tail -40 sync.log 2>/dev/null || echo 'no output captured')
          \`\`\`

          [Run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          Nothing was committed, so the published dataset is unchanged and personal data is untouched." \
            || echo "could not open an issue"
